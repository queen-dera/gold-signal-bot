name: Discord test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is empty or not found"
            exit 1
          fi
          curl -sS -f -X POST -H "Content-Type: application/json" -d '{"content":"✅ Gold signal bot test message"}' "$WEBHOOK"
